<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Crave — Online Food Ordering</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#070b1f;--glass:rgba(255,255,255,.055);--line:rgba(255,255,255,.12);--tx:#eef2ff;--mut:#9aa4cf;--sf:#ffc857;--ch:#ff6b81;--mn:#2de2c4;--vi:#8b6cff;--ink:#1b1200;--r:22px;
 --f:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{font-family:var(--f);color:var(--tx);min-height:100vh;overflow-x:hidden;line-height:1.5;
 background:radial-gradient(55% 45% at 88% -5%,rgba(139,108,255,.38),transparent 62%),radial-gradient(45% 40% at -5% 28%,rgba(45,226,196,.15),transparent 62%),radial-gradient(40% 40% at 60% 105%,rgba(255,107,129,.14),transparent 60%),var(--bg) fixed}
#bg{position:fixed;inset:0;z-index:0;pointer-events:none}
button,select,input,textarea{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:2px solid var(--mn);outline-offset:2px}
main{position:relative;z-index:2;max-width:1160px;margin:auto;padding:0 20px}
header{position:sticky;top:12px;z-index:8;width:calc(100% - 32px);max-width:1160px;margin:14px auto 0;display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:22px;flex-wrap:wrap}
.logo{font-size:27px;font-weight:800;letter-spacing:-1.2px;cursor:pointer;margin-right:auto}.logo i{color:var(--mn);font-style:normal}
.glass{background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(18px) saturate(1.3);-webkit-backdrop-filter:blur(18px) saturate(1.3);box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 24px 60px -28px rgba(0,0,0,.8)}
header.glass{background:rgba(12,16,42,.72)}
nav{display:flex;gap:2px}
nav button{background:none;border:0;padding:9px 16px;border-radius:12px;color:var(--mut);font-weight:600;transition:background .2s,color .2s}
nav button:hover{color:var(--tx)}
nav button.on{background:rgba(139,108,255,.22);color:#fff;box-shadow:inset 0 0 0 1px rgba(139,108,255,.55)}
.pill{border-radius:12px;padding:9px 14px;border:1px solid var(--line);background:var(--glass);display:flex;gap:8px;align-items:center;font-weight:600;transition:background .2s}
.pill:hover{background:rgba(255,255,255,.1)}
.av{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--vi),var(--mn));font-size:12px;font-weight:800;color:#06102a}
#cartbtn b{background:var(--ch);border-radius:99px;min-width:22px;height:22px;display:grid;place-items:center;font-size:12px;padding:0 6px}
.btn{border:0;border-radius:14px;padding:12px 22px;font-weight:700;color:#fff;background:linear-gradient(135deg,#9b82ff,#5b6cff);box-shadow:0 12px 28px -12px #6b5cff,inset 0 1px 0 rgba(255,255,255,.35);transition:transform .15s,box-shadow .15s,filter .15s}
.btn:hover{transform:translateY(-2px);filter:brightness(1.1)}.btn:active{transform:translateY(1px) scale(.98)}
.btn.cherry{background:linear-gradient(135deg,#ff8aa0,var(--ch));box-shadow:0 12px 28px -12px var(--ch),inset 0 1px 0 rgba(255,255,255,.35)}
.btn.mint{background:linear-gradient(135deg,#6af2d8,var(--mn));color:#052a24;box-shadow:0 12px 28px -12px var(--mn),inset 0 1px 0 rgba(255,255,255,.5)}
.btn.ghost{background:var(--glass);color:var(--tx);box-shadow:none;border:1px solid var(--line)}.btn.sm{padding:7px 13px;border-radius:10px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.view{display:none;padding:36px 0 120px}.view.on{display:block;animation:in .5s cubic-bezier(.2,.9,.3,1)}
@keyframes in{from{opacity:0;transform:translateY(14px)}}
h1{font-size:clamp(42px,7.2vw,82px);line-height:.95;letter-spacing:-3px;font-weight:800}
h2{font-size:28px;letter-spacing:-.8px;margin:6px 0 16px}
.mut{color:var(--mut)}
.hero{padding:40px 0 20px;max-width:600px}.hero p{color:var(--mut);margin:18px 0 26px;font-size:19px;max-width:470px}
.cta{display:flex;gap:12px;flex-wrap:wrap}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:22px}.chip{padding:6px 12px;border-radius:99px;font-size:12.5px;font-weight:600;color:var(--mut);border:1px solid var(--line);background:var(--glass)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin:34px 0 44px;max-width:640px}
.stat{padding:16px 18px;border-radius:18px}.stat b{display:block;font-size:30px;letter-spacing:-1px}.stat span{color:var(--mut);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:20px;perspective:1100px}
.tilt{position:relative;transform-style:preserve-3d;transition:transform .18s ease-out;border-radius:var(--r);will-change:transform}
.tilt::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;transition:opacity .3s;background:radial-gradient(circle at var(--gx,50%) var(--gy,50%),rgba(255,255,255,.18),transparent 55%)}
.tilt:hover::after{opacity:1}
.rc{padding:22px;cursor:pointer;min-height:236px;display:flex;flex-direction:column;justify-content:space-between}
.rc .em,.it .em{font-size:68px;line-height:1;transform:translateZ(60px);filter:drop-shadow(0 22px 14px rgba(0,0,0,.55));display:inline-block}
.rc h3,.it h3{font-size:20px;letter-spacing:-.4px;transform:translateZ(34px)}
.meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;transform:translateZ(22px)}
.tag{padding:3px 10px;border-radius:99px;font-size:12px;font-weight:600;background:rgba(255,255,255,.1)}
.tag.ok{background:rgba(45,226,196,.2);color:var(--mn)}.tag.bad{background:rgba(255,107,129,.2);color:var(--ch)}.tag.sf{background:rgba(255,200,87,.18);color:var(--sf)}
.it{padding:18px;display:flex;flex-direction:column;gap:6px;min-height:240px}
.it .d{font-size:13px;color:var(--mut);flex:1;transform:translateZ(16px)}
.it .row{display:flex;justify-content:space-between;align-items:center;transform:translateZ(40px)}
.it.off{opacity:.5}.pr{color:var(--sf);font-weight:800;font-size:20px}
.veg{display:inline-block;width:12px;height:12px;border:2px solid var(--mn);border-radius:3px;position:relative;margin-right:6px;vertical-align:middle}.veg::after{content:"";position:absolute;inset:2px;background:var(--mn);border-radius:50%}
.veg.nv{border-color:var(--ch)}.veg.nv::after{background:var(--ch)}
.rhead{display:flex;gap:22px;align-items:center;flex-wrap:wrap;padding:24px;margin-bottom:10px;border-radius:26px}
.rhead .em{font-size:78px;filter:drop-shadow(0 18px 12px rgba(0,0,0,.55))}
.cat{margin:28px 0 12px;font-size:19px;letter-spacing:-.3px;color:var(--mn)}
#scrim{position:fixed;inset:0;z-index:9;background:rgba(4,6,20,.6);opacity:0;pointer-events:none;transition:opacity .3s}#scrim.on{opacity:1;pointer-events:auto}
#drawer{position:fixed;top:12px;right:12px;bottom:12px;z-index:10;width:min(420px,calc(100vw - 24px));padding:22px;border-radius:28px;overflow-y:auto;background:rgba(14,18,46,.95);transform:perspective(1400px) translateX(115%) rotateY(-24deg);transform-origin:right center;transition:transform .55s cubic-bezier(.2,.9,.25,1)}
#drawer.on{transform:perspective(1400px) translateX(0) rotateY(0)}
.ln{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}.ln .n{flex:1;font-size:15px}
.qty{display:flex;align-items:center;gap:8px}.qty button{width:28px;height:28px;border-radius:9px;border:1px solid var(--line);background:var(--glass)}
input,textarea,select{width:100%;background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:6px;transition:border-color .2s,box-shadow .2s}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--vi);box-shadow:0 0 0 4px rgba(139,108,255,.2)}
select option{background:#12163a}
label{display:block;font-size:13px;font-weight:600;color:var(--mut);margin-top:14px}
.seg{display:flex;gap:6px;margin-top:6px}.seg button{flex:1;padding:10px;border-radius:12px;border:1px solid var(--line);background:var(--glass);font-weight:600}.seg button.on{background:rgba(255,107,129,.2);border-color:var(--ch);color:#fff}
.sum{margin:16px 0 4px;font-size:14px}.sum div{display:flex;justify-content:space-between;padding:3px 0}.sum .t{font-size:20px;font-weight:800;border-top:1px solid var(--line);margin-top:6px;padding-top:10px}
#modal{position:fixed;inset:0;z-index:20;display:none;place-items:center;background:rgba(4,6,20,.72);padding:16px}#modal.on{display:grid}
#mbox{width:min(420px,100%);padding:26px;border-radius:28px;background:rgba(16,20,50,.98);animation:pop .45s cubic-bezier(.2,1.2,.3,1)}
@keyframes pop{from{opacity:0;transform:perspective(900px) rotateX(24deg) scale(.9)}}
.stars button{background:none;border:0;font-size:30px;color:var(--mut);padding:0 3px}.stars button.on{color:var(--sf);text-shadow:0 0 14px var(--sf)}
/* login / sign-up page */
.authwrap{display:grid;grid-template-columns:1.05fr .95fr;gap:28px;align-items:center;min-height:calc(100vh - 190px)}
.authL h1{font-size:clamp(36px,5vw,58px);letter-spacing:-2.2px}.authL p{color:var(--mut);font-size:17px;margin:16px 0 26px;max-width:430px}
.perks{display:grid;gap:12px;margin-bottom:30px}.perks div{display:flex;gap:12px;align-items:center;font-weight:600}.perks span{width:38px;height:38px;display:grid;place-items:center;border-radius:12px;background:rgba(139,108,255,.2);font-size:18px}
.peek{max-width:430px;padding:18px 20px;border-radius:22px;transform:perspective(900px) rotateY(-14deg) rotateX(6deg);animation:bob 6s ease-in-out infinite}
@keyframes bob{50%{transform:perspective(900px) rotateY(-10deg) rotateX(3deg) translateY(-8px)}}
.authR{padding:34px;border-radius:30px;max-width:460px;width:100%;justify-self:center}
.authR h2{font-size:30px;margin:0 0 4px}
.pw{position:relative}.pw button{position:absolute;right:8px;top:12px;background:none;border:0;color:var(--mut);padding:6px 8px;font-size:13px;font-weight:600}
.aerr{min-height:20px;color:var(--ch);font-size:13.5px;font-weight:600;margin-top:12px}
.or{display:flex;align-items:center;gap:12px;color:var(--mut);font-size:12.5px;margin:18px 0 12px}.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.demos{display:grid;grid-template-columns:1fr 1fr;gap:10px}
/* orders & tracker */
.oc{padding:22px;border-radius:var(--r);margin-bottom:18px}
.trk{display:flex;justify-content:space-between;position:relative;margin:26px 8px 6px}
.trk::before,.trk i{content:"";position:absolute;top:13px;left:0;height:4px;border-radius:4px}
.trk::before{right:0;background:var(--line)}.trk i{width:var(--p);background:linear-gradient(90deg,var(--vi),var(--mn));box-shadow:0 0 16px rgba(45,226,196,.6);transition:width 1s cubic-bezier(.2,.9,.3,1)}
.st{position:relative;text-align:center;font-size:12px;color:var(--mut);width:64px;margin:0 -16px;font-weight:600}
.st span{display:grid;place-items:center;width:30px;height:30px;margin:0 auto 8px;border-radius:50%;background:#1a1f4a;border:2px solid var(--line);font-size:14px}
.st.done{color:var(--tx)}.st.done span{background:var(--mn);border-color:var(--mn);color:#052a24}
.st.cur span{background:var(--vi);border-color:var(--vi);animation:pulse 1.6s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(139,108,255,.8)}100%{box-shadow:0 0 0 16px rgba(139,108,255,0)}}
/* admin */
.sub{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap}.sub button.on{background:rgba(139,108,255,.25);border-color:var(--vi)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:18px;perspective:1000px;margin-bottom:22px}
.kpi{padding:22px}.kpi small{color:var(--mut);display:block;transform:translateZ(16px);font-weight:600}.kpi b{font-size:34px;letter-spacing:-1px;transform:translateZ(44px);display:block;margin-top:6px}
.rep{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px}.rep .glass{padding:22px;border-radius:var(--r)}
.bar{display:grid;grid-template-columns:110px 1fr 76px;gap:8px;align-items:center;font-size:14px;margin-top:10px}
.bar b{display:block;height:12px;border-radius:9px;background:linear-gradient(90deg,var(--vi),var(--mn));transform-origin:left;animation:g .9s cubic-bezier(.2,.9,.3,1) both;box-shadow:0 4px 14px -4px var(--vi)}
@keyframes g{from{transform:scaleX(0)}}
.wrap{overflow-x:auto;border-radius:var(--r)}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:560px}
th,td{padding:11px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}th{color:var(--mut);font-weight:600}
td select,td input{width:auto;margin:0;padding:6px 8px;border-radius:8px}td input{width:90px}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;padding:18px;border-radius:var(--r);margin-top:18px}
/* database page */
.concepts{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px;margin-bottom:34px}
.concept{padding:18px;border-radius:18px}.concept b{display:block;margin-bottom:4px}.concept b::before{content:"✓";color:var(--mn);margin-right:8px}.concept span{color:var(--mut);font-size:13.5px}
.schema{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px;margin-bottom:34px}
.tbl{border-radius:18px;overflow:hidden}.tbl h4{padding:12px 16px;display:flex;justify-content:space-between;background:rgba(139,108,255,.16);font-size:15px}.tbl h4 small{color:var(--mut);font-weight:600}
.col{display:flex;gap:8px;align-items:center;padding:6px 16px;font-size:13px;border-top:1px solid var(--line)}.col span:first-child{flex:1;font-weight:600}.col em{color:var(--mut);font-style:normal;font-size:12px}
.badge{font-size:10.5px;font-weight:800;padding:1px 7px;border-radius:6px}.badge.pk{background:var(--sf);color:var(--ink)}.badge.fk{background:rgba(45,226,196,.2);color:var(--mn)}
pre{background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:14px;padding:14px;overflow-x:auto;font-size:12.5px;line-height:1.55;color:#cfd6ff;font-family:ui-monospace,Consolas,monospace;white-space:pre-wrap}
details{border-radius:14px;padding:12px 16px;margin-bottom:10px}details summary{cursor:pointer;font-weight:700}details pre{margin-top:10px}
.lab{display:grid;grid-template-columns:minmax(240px,320px) 1fr;gap:18px}.lab .glass{padding:18px;border-radius:var(--r)}
.qbtn{display:block;width:100%;text-align:left;padding:10px 12px;border-radius:12px;border:1px solid transparent;background:none;margin-bottom:4px}.qbtn small{display:block;color:var(--mut);font-size:12px}
.qbtn.on,.qbtn:hover{background:rgba(139,108,255,.2);border-color:rgba(139,108,255,.5)}
#toast{position:fixed;left:50%;top:16px;z-index:30;transform:translate(-50%,-130px);background:var(--mn);color:#052a24;padding:12px 22px;border-radius:14px;font-weight:700;transition:transform .45s cubic-bezier(.2,.9,.3,1.3);max-width:92vw}
#toast.show{transform:translate(-50%,0)}#toast.err{background:var(--ch);color:#fff}
.empty{padding:40px;text-align:center;color:var(--mut)}
@media(max-width:820px){.authwrap,.lab{grid-template-columns:1fr}.authL{display:none}}
@media(max-width:640px){nav{order:3;width:100%;overflow-x:auto}.hero{padding-top:14px}.st{font-size:10px}header{top:8px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<canvas id="bg"></canvas><div id="toast" role="status"></div>
<header class="glass">
 <div class="logo" id="logo">crave<i>.</i></div>
 <nav id="nav"><button data-v="home" class="on">Order</button><button data-v="orders">My orders</button><button data-v="db">Database</button><button data-v="admin" id="adminTab" hidden>Admin</button></nav>
 <button class="pill" id="who">Log in</button><button class="pill" id="out" hidden>Log out</button>
 <button class="pill" id="cartbtn" aria-label="Open cart">🛒 Cart <b id="cc">0</b></button>
</header>
<main>
 <section class="view on" id="home">
  <div class="hero"><h1>Hot food,<br>zero phone calls.</h1><p>Order from four Karachi kitchens and watch every step, from the oven to your door.</p>
   <div class="cta"><button class="btn" id="startBtn">Browse restaurants</button><button class="btn ghost" id="dbBtn">See the database</button></div>
   <div class="chips"><span class="chip">FastAPI</span><span class="chip">SQLite</span><span class="chip">Three.js</span><span class="chip">Triggers &amp; views</span></div></div>
  <div class="stats" id="stats"></div>
  <h2 id="rtitle">Restaurants near you</h2><div class="grid" id="rests"></div>
 </section>
 <section class="view" id="menu"></section>
 <section class="view" id="orders"></section>
 <section class="view" id="db"></section>
 <section class="view" id="admin"></section>
 <section class="view" id="auth"></section>
</main>
<div id="scrim"></div>
<aside id="drawer" class="glass" aria-label="Your cart"></aside>
<div id="modal"><div id="mbox" class="glass"></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $=s=>document.querySelector(s),pk=n=>'Rs '+Math.round(Number(n)).toLocaleString('en-PK');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LS=(()=>{try{return localStorage}catch(e){return{getItem(){},setItem(){},removeItem(){}}}})();
let S={user:null,token:LS.getItem('crave_token'),rests:[],rest:null,menu:[],cart:{},coupon:null,method:'Cash',view:'home',sub:'dash',poll:null};
const STEPS=[['Pending','Placed'],['Confirmed','Confirmed'],['Preparing','Cooking'],['Out for Delivery','On the way'],['Delivered','Delivered']];
const NEXT={'Pending':['Confirmed','Cancelled'],'Confirmed':['Preparing','Cancelled'],'Preparing':['Out for Delivery','Cancelled'],'Out for Delivery':['Delivered','Cancelled'],'Delivered':[],'Cancelled':[]};
async function api(u,m,b){
 const r=await fetch('/api'+u,{method:m||'GET',headers:{'Content-Type':'application/json',...(S.token?{Authorization:'Bearer '+S.token}:{})},body:b?JSON.stringify(b):undefined});
 let j={};try{j=await r.json()}catch(e){}
 if(r.status===401&&S.token){logout(true)}
 if(!r.ok)throw new Error(typeof j.detail==='string'?j.detail:'Please check your input and try again');return j}
function toast(t,e){const x=$('#toast');x.textContent=t;x.className='show'+(e?' err':'');clearTimeout(toast.t);toast.t=setTimeout(()=>x.className='',2800)}
const guard=f=>async(...a)=>{try{return await f(...a)}catch(e){toast(e.message,1)}};

/* ---------- navigation ---------- */
function go(v){S.view=v;clearInterval(S.poll);
 document.querySelectorAll('.view').forEach(e=>e.classList.toggle('on',e.id===v));
 document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===v||(v==='menu'&&b.dataset.v==='home')));
 scrollTo({top:0});sceneTo(v==='home'?'home':'away');
 if(v==='orders'){if(!S.user){S.after='orders';return authModal()}drawOrders();S.poll=setInterval(drawOrders,12000)}
 if(v==='admin'){if(!S.user||S.user.role!=='admin')return go('home');drawAdmin()}
 if(v==='db')drawDb()}
$('#nav').onclick=e=>{const b=e.target.closest('button');if(b)go(b.dataset.v)};
$('#logo').onclick=()=>go('home');$('#startBtn').onclick=()=>$('#rtitle').scrollIntoView();$('#dbBtn').onclick=()=>go('db');

/* ---------- auth ---------- */
function modal(h){$('#mbox').innerHTML=h;$('#modal').classList.add('on')}function closeModal(){$('#modal').classList.remove('on');$('#mbox').innerHTML=''}
$('#modal').onclick=e=>{if(e.target.id==='modal')closeModal()};
async function loadMe(){if(!S.token)return refreshUser();try{S.user=await api('/auth/me')}catch(e){S.user=null}refreshUser()}
function refreshUser(){const u=S.user;$('#who').innerHTML=u?`<span class="av">${esc(u.name[0])}</span>${esc(u.name.split(' ')[0])}${u.role==='admin'?' · Admin':''}`:'Log in';$('#out').hidden=!u;$('#adminTab').hidden=!(u&&u.role==='admin')}
function logout(silent){S.token=null;S.user=null;LS.removeItem('crave_token');refreshUser();if(!silent){toast('Logged out');go('home')}}
$('#who').onclick=()=>S.user?go('orders'):authModal();$('#out').onclick=()=>logout();
function authModal(mode='in'){go('auth');authView(mode)}
function authView(mode){const up=mode==='up';
 $('#auth').innerHTML=`<div class="authwrap">
  <div class="authL"><h1>Dinner, delivered in real time.</h1><p>One account for ordering, tracking and rating. Staff sign in here too.</p>

   <div class="wrap">${r.rows.length?`<table><thead><tr>${r.columns.map(c=>`<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>${r.rows.map(row=>`<tr>${row.map(v=>`<td>${esc(v)}</td>`).join('')}</tr>`).join('')}</tbody></table>`:'<div class="empty">No rows. For the integrity check, that is the expected result.</div>'}</div>`});

/* ---------- 3D card tilt with glare (mouse only) ---------- */
let lastTilt=null;
document.addEventListener('pointermove',e=>{if(e.pointerType!=='mouse')return;const t=e.target.closest?.('.tilt');
 if(lastTilt&&lastTilt!==t){lastTilt.style.transform='';lastTilt=null}
 if(!t)return;lastTilt=t;const r=t.getBoundingClientRect(),x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;
 t.style.setProperty('--gx',x*100+'%');t.style.setProperty('--gy',y*100+'%');
 t.style.transform=`perspective(900px) rotateY(${(x-.5)*16}deg) rotateX(${(.5-y)*16}deg) translateZ(10px)`});
document.addEventListener('pointerleave',()=>{if(lastTilt){lastTilt.style.transform='';lastTilt=null}});
